<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Miyuki Beads Designer</title>
    <script>
      // GitHub Pages has no server-side rewrite, so a hard load of a client-side
      // route (e.g. /miyuki-beads-designer/peyote-grid) lands here. Stash the
      // route in the query string and bounce to index.html, which puts it back.
      // Technique: https://github.com/rafgraph/spa-github-pages
      // 1 = the number of path segments that belong to the site itself (the repo name).
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1) : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
